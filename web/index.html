<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>MTask · AI 任务开发管理工具</title>
    <!--
      T03179（PM-301③）：首帧前应用主题/字号。React 挂载前 documentElement 上没有 data-theme 也没有 --fs-*，
      冷启动会先以浅色 + 默认字号画一帧，暗色用户看到白→深跳变。这里在 <head> 同步读缓存并写入变量，
      规则与 web/src/settings.tsx 同源（表由 gate 逐项比对，勿单侧修改）。
    -->
    <script>
      (function () {
        var FS = {
          s: { '--fs-2xs': '9px', '--fs-xs': '10px', '--fs-s': '11px', '--fs-m': '12px', '--fs-l': '13px', '--fs-xl': '14px', '--fs-2xl': '16px', '--fs-title': '18px' },
          m: { '--fs-2xs': '10px', '--fs-xs': '11px', '--fs-s': '12px', '--fs-m': '13px', '--fs-l': '14px', '--fs-xl': '15px', '--fs-2xl': '17px', '--fs-title': '20px' },
          l: { '--fs-2xs': '11px', '--fs-xs': '12px', '--fs-s': '13px', '--fs-m': '14px', '--fs-l': '15px', '--fs-xl': '17px', '--fs-2xl': '19px', '--fs-title': '22px' }
        };
        var FONT = {
          default: '"system-ui", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
          mono: '"Cascadia Mono", "JetBrains Mono", Consolas, Menlo, monospace',
          kai: '"Kaiti SC", "KaiTi", "STKaiti", serif',
          song: '"Songti SC", "NSimSun", "SimSun", serif'
        };
        try {
          var p = {};
          var raw = localStorage.getItem('settings.prefs');
          if (raw) p = JSON.parse(raw) || {};
          var root = document.documentElement;
          var theme = p.theme === 'dark' || p.theme === 'light' || p.theme === 'auto' ? p.theme : 'light';
          if (theme === 'auto') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.dataset.theme = theme;
          root.dataset.zen = p.zen === true ? '1' : '';
          if (FONT[p.font]) root.style.setProperty('--font-family', FONT[p.font]);
          var sizes = FS[p.fontSize] || FS.m;
          for (var k in sizes) {
            if (Object.prototype.hasOwnProperty.call(sizes, k)) root.style.setProperty(k, sizes[k]);
          }
          var accent = typeof p.accent === 'string' && /^#[0-9a-fA-F]{6}$/.test(p.accent.trim()) ? p.accent.trim() : '';
          if (accent) {
            var r = parseInt(accent.slice(1, 3), 16) / 255;
            var g = parseInt(accent.slice(3, 5), 16) / 255;
            var b = parseInt(accent.slice(5, 7), 16) / 255;
            var lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            root.style.setProperty('--accent', accent);
            root.style.setProperty('--accent-soft', 'color-mix(in srgb, ' + accent + ' 10%, var(--app-bg))');
            root.style.setProperty('--accent-text', lum > 0.72 ? '#1f2937' : '#ffffff');
          }
        } catch (e) { /* 缓存损坏/隐私模式：按默认浅色渲染，React 挂载后自会纠正 */ }
      })();
    </script>
    <style>
      /* 首帧底色：与 settings.tsx 的 :root 默认值一致；React 注入完整样式表前先兜住白底 */
      :root {
        --app-bg: #ffffff;
        --text: #1f2937;
        --fs-2xs: 10px;
        --fs-xs: 11px;
        --fs-s: 12px;
        --fs-m: 13px;
        --fs-l: 14px;
        --fs-xl: 15px;
        --fs-2xl: 17px;
        --fs-title: 20px;
      }
      [data-theme='dark'] {
        --app-bg: #18181b;
        --text: #e5e7eb;
      }
      html, body, #root {
        background: var(--app-bg);
      }
      body {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
