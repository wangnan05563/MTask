<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- 字母 M（任务清单主形象） -->
  <path d="M128 360 V164 L208 266 L288 164 V360"
        fill="none" stroke="#ffffff" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右下角勾选徽标（任务完成） -->
  <circle cx="368" cy="344" r="74" fill="#ffffff"/>
  <path d="M334 344 l24 24 l46 -50"
        fill="none" stroke="#2563eb" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 右上角 AI 星光 -->
  <path d="M396 108 l11 29 l29 11 l-29 11 l-11 29 l-11 -29 l-29 -11 l29 -11 z" fill="#ffffff" opacity="0.95"/>
</svg>
