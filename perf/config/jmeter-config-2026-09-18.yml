        - { name: "task_to_req",          path: "/api/tasks/{{task_id3}}/to-req", method: "POST",
            body: '{"categoryId":"{{req_cat_id}}"}' }
        - { name: "archive_task",         path: "/api/archive", method: "POST",
            body: '{"taskIds":["{{task_arch}}"]}' }
        - { name: "restore_task",         path: "/api/archive/restore", method: "POST",
            body: '{"taskIds":["{{task_restore}}"]}' }
        - { name: "create_category",      path: "/api/task-categories", method: "POST",
            body: '{"name":"perf-cat"}' }
        - { name: "patch_category",       path: "/api/task-categories/{{category_id}}", method: "PATCH",
            body: '{"name":"压测分类"}' }
        - { name: "create_aitool",        path: "/api/aitools", method: "POST",
            body: '{"name":"perf-tool","type":"openaiCompat","purpose":"develop","endpoint":"http://127.0.0.1:9","model":"gpt-4o"}' }
        - { name: "patch_aitool",         path: "/api/aitools/{{tool_id}}", method: "PATCH",
            body: '{"model":"gpt-4o","enabled":true}' }
        - { name: "reorder_aitools",      path: "/api/aitools/reorder", method: "POST",
            body: '{"orderedIds":["{{tool_id}}","{{tool_id2}}","{{tool_id3}}"]}' }
        - { name: "set_default_tool",     path: "/api/aitools/{{tool_id}}/set-default", method: "POST",
            body: '{"kind":"develop"}' }
        - { name: "create_queue",         path: "/api/queues", method: "POST",
            body: '{"name":"perf-queue","date":"2026-09-13"}' }
        - { name: "add_queue_jobs",       path: "/api/queues/{{queue_id}}/jobs", method: "POST",
            body: '{"items":[{"taskId":"{{task_id}}","toolId":"{{tool_id}}"}]}' }
        - { name: "reset_queue",          path: "/api/queues/{{queue_id}}/reset", method: "POST",
