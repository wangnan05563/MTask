    - { name: "prd_issue_delete", path: "/api/plans/prd-issues/{{prd_issue_del}}", method: "DELETE" }
    - { name: "prd_req_link", path: "/api/plans/prd-requirements/{{prd_req_id}}/link", method: "POST",
        body: '{"kind":"plan","targetId":"{{plan_id}}","linked":true}' }
    - { name: "prd_req_delete", path: "/api/plans/prd-requirements/{{prd_req_del}}", method: "DELETE" }
    - { name: "history_transfer", path: "/api/history/transfer", method: "POST", body: '{"projectId":"{{proj_transfer}}"}' }
    - { name: "history_restore", path: "/api/history/restore", method: "POST", body: '{"projectId":"{{proj_transfer}}"}' }
    - { name: "history_to_archive", path: "/api/history/to-archive", method: "POST", body: '{"projectId":"{{proj_transfer}}"}' }
    - { name: "ws_symbols_refresh", path: "/api/workspace/symbols/refresh", method: "POST", body: '{"projectId":"{{project_id}}"}' }
    - { name: "workspace_create", path: "/api/projects/workspace-create", method: "POST",
        body: '{"path":"D:/code/otherProjects/26_MTask/perf/sandbox/ws-probe"}' }

# ---------------------------------------------------------------------------
# 缺陷判定规则
# ---------------------------------------------------------------------------
defect_rules:
  defect_codes: ["000", "405"]
  defect_prefixes: ["5"]
  expected_codes: ["404"]
  assertion_mismatch_is_defect: false

# ---------------------------------------------------------------------------
# 回归对比：本轮为全新确定性数据集，无同构历史基线 → 关闭
# （组内并发梯度对比由引擎 --report 的总览 + 本报告自建端点表完成）
# ---------------------------------------------------------------------------
comparison:
  enabled: false
  baseline_jtl: ""
  key_endpoints: []
  baseline_integrity:
    enforce_same_endpoints: false
    doc_fallback_allowed: false

analysis:
  enabled: false
  inputs: []
  endpoint_groups: []
  percentiles: [50, 95, 99]
  output_report: ""

# ---------------------------------------------------------------------------
report:
  formats: ["markdown"]
  output_dir: "D:/code/otherProjects/26_MTask/perf/out4"
  percentiles: [50, 95, 99]
  endpoint_table: true
  group_label_prefixes: []

results:
  output_dir: "D:/code/otherProjects/26_MTask/perf/out4"
  format: csv
  keep_count: 10

logging:
  level: INFO
  file: "perf/out4/perf.log"
  verbose: false
