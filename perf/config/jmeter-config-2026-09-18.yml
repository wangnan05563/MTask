# ============================================================================
# 26_MTask 后端 API 全端点性能压测配置（jmeter-performance-test，配置驱动）
# 被测目标：Express + better-sqlite3 后端（独立沙箱实例，绝不连生产库）
# 开发端口 39876；生产/打包实例在 39877（F:\Program Files\MTask），不触碰。
# 数据目录：perf/sandbox/data2（由 perf/seed/seed-v2.js 播种的确定性夹具集）
# ============================================================================

# 无 Java/JMeter（已探测），强制使用内置 Python 回放引擎
mode: python_replay

jmeter:
  bin: ""
  java_home: ""
  jvm_args:
    - "-Xms512m"
    - "-Xmx2048m"
  properties_file: ""
  cli_extra_args: ""

# ---------------------------------------------------------------------------
# 沙箱隔离：独立数据目录 + 独立端口，引擎自动拉起 / 回收
# ---------------------------------------------------------------------------
sandbox:
  # 本轮由编排层手工管理 SUT 生命周期（探针 + 全阶段共用同一实例，状态连续、只冷启动一次）；
  # 隔离三要素不变：专用端口 39899 + 独立数据目录 data3 + 定向关停（kill_sut.py 按 pid_file）。
  enabled: false
  cwd: "D:/code/otherProjects/26_MTask/perf/sandbox"
  # SUT = 编译产物 server/dist/index.js（与 src 同步重建），由 managed Node 22.22.2 启动
  startup_cmd: "C:/Users/hspcadmin/.workbuddy/binaries/node/versions/22.22.2-2/node.exe D:/code/otherProjects/26_MTask/server/dist/index.js"
  pkg: ""
  port: 39899
  health_path: "/api/health"
  health_retries: 200          # CPU 饱和 + 杀软扫描下 SUT 冷启动可能 >110s

  port_kill_retries: 3
  port_kill_wait_ms: 500
  require_new_instance: true

  # 关键：注入独立数据目录，绝不连生产库（%APPDATA%\mtask\data 与 server/src/data）
  # 端口 39899：与 dev 工具链(39876)/打包生产(39877) 隔离——dev 启动脚本会清空 39876，
  # 若共用同一端口会导致沙箱 SUT 被 dev 实例顶掉、压测流量打到带 accessToken 的 dev 服务（整批 401）。
  env_overrides:
    MTask_PORT: "39899"
    MTask_DATA_DIR: "D:/code/otherProjects/26_MTask/perf/sandbox/data3"

  preflight:
    enabled: true
    rate_limit_burst: 20        # 本地无限流，突发探测仅作安全闸门
    burst_path: "/api/health"
    abort_on_rate_limit: true
    login_warmup: false

  min_output_lines: 10

  process_match:
    mode: cmd_substr
    cmd_substr: "server/dist/index.js"

  lifecycle:
    never_global_kill: true     # 只定向终止引擎 spawn 的进程，绝不全局杀 node.exe
    kill_tree: true
    kill_retries: 5
    kill_wait_ms: 500

# ---------------------------------------------------------------------------
# 资源监控 sidecar（量化 SUT 在负载下的内存 / CPU）
# ---------------------------------------------------------------------------
resource_monitor:
  enabled: true
  # 用 pid_file 精确定位 SUT：cmd_substr 依赖 WMI 命令行枚举，在本机实测未命中
  # （监听 pid 的命令行为 `.../node.exe D:/.../server/dist/index.js`，含正斜杠），
  # 故改由压测编排在 SUT 就绪后写入监听 pid（perf/out3/sut.pid），最精确无歧义。
  match:
    mode: pid_file
    pid_file: "D:/code/otherProjects/26_MTask/perf/out4/sut.pid"
  sample_interval_sec: 3
  duration_samples: 400         # 覆盖「冷启动 + 全阶段负载(≈560s)」并留余量，自动落盘退出
  metrics: ["rss_mb", "private_mb", "cpu_percent", "handles", "threads"]
  output_csv: "D:/code/otherProjects/26_MTask/perf/out4/sut_resource.csv"
  alert:
    enabled: true
    max_rss_mb: 600
    on_exceed: warn

# ---------------------------------------------------------------------------
# 目标服务
# ---------------------------------------------------------------------------
target:
  base_url: "http://127.0.0.1:39899"
  default_timeout_sec: 60
  ramp_stagger: true
  fixed_headers: { "Accept": "application/json" }
  auth:
    type: none                  # accessToken 未配置，整体放行

# ---------------------------------------------------------------------------
# 压测阶段（先 smoke 后 full；同一 JMX 用 threads_override 覆盖线程档）
# 顺序原则：先读后写（保证读基线不被写膨胀污染），重端点与稳定性收尾。
# ---------------------------------------------------------------------------
phases:
  - name: "smoke_reads"        # 冒烟：读端点单线程，验证采样器/路径正确
    jmx: "jmeter/reads.jmx"
    enabled: true
    threads_override: 1
    duration_override: 20
  - name: "smoke_writes"       # 冒烟：写端点单线程，早期暴露系统性 4xx
    jmx: "jmeter/writes.jmx"
    enabled: true
    threads_override: 1
    duration_override: 12
  - name: "reads_baseline"     # 读基准：5 并发（低并发代表真实服务延迟）
    jmx: "jmeter/reads.jmx"
    enabled: true
    threads_override: 5
    duration_override: 60
  - name: "reads_mid"          # 读中等：15 并发
    jmx: "jmeter/reads.jmx"
    enabled: true
    threads_override: 15
    duration_override: 60
  - name: "reads_stress"       # 读压力：30 并发
    jmx: "jmeter/reads.jmx"
    enabled: true
    threads_override: 30
    duration_override: 60
  - name: "writes_baseline"    # 写基准：5 并发
    jmx: "jmeter/writes.jmx"
    enabled: true
    threads_override: 5
    duration_override: 45
  - name: "writes_mid"         # 写中等：10 并发（SQLite 单写者，观察锁竞争）
    jmx: "jmeter/writes.jmx"
    enabled: true
    threads_override: 10
    duration_override: 45
  - name: "writes_stress"      # 写压力：20 并发
    jmx: "jmeter/writes.jmx"
    enabled: true
    threads_override: 20
    duration_override: 45
  - name: "heavy"              # 重端点：报表/导出/大数据量，单线程
    jmx: "jmeter/heavy.jmx"
    enabled: true
    threads_override: 1
    duration_override: 45
  - name: "stability"          # 稳定性：读写混合，10 并发 × 180s（本轮加长以观察内存/WAL 增长）
    jmx: "jmeter/mixed.jmx"
    enabled: true
    threads_override: 10
    duration_override: 180

# ---------------------------------------------------------------------------
# 场景生成（配置驱动）：gen_jmx.py 按 scenarios 段批量生成 JMX
# ---------------------------------------------------------------------------
scenarios:
  enabled: true
  output_jmx_dir: "jmeter"
  default_protocol: "http"
  default_method: "GET"
  fixtures:
    project_id:    "proj-main"
    project_id2:   "proj-secondary"
    project_id3:   "proj-tri"
    project_del:   "proj-del-001"
    task_id:       "task-0001"
    task_id2:      "task-0002"
    task_id3:      "task-0003"
    task_arch:     "task-0004"
    task_restore:  "task-a001"
    task_no:       "T00001"
    # 中文查询值必须预编码：回放引擎按原样拼 query，非 ASCII 直接进 URL 会被 urllib 拒绝（000 伪故障）。
    # 「压测」的 UTF-8 百分号编码；Express 侧解码后仍为中文，等价于前端真实输入。
    keyword_q:     "%E5%8E%8B%E6%B5%8B"
    category_id:   "cat-perf"
    category_extra: "cat-extra-001"
    category_del:  "cat-del-001"
    tool_id:       "tool-perf"
    tool_id2:      "tool-claude"
    tool_id3:      "tool-ollama"
    tool_del:      "tool-del-001"
    queue_id:      "queue-perf"
    queue_id2:     "queue-2"
    prompt_cat_id: "cat-prompt-perf"
    prompt_cat_del: "cat-prompt-del-001"
    prompt_id:     "prompt-perf"
    prompt_del:    "prompt-del-001"
    req_cat_id:    "req-cat-perf"
    req_cat_del:   "req-cat-del-001"
    req_id:        "req-perf"
    req_del:       "req-del-001"
    plan_id:       "plan-001"
    plan_id2:      "plan-002"
    plan_del:      "plan-del-001"
    console_job_id: "console-001"
    image_id:      "img-0001"
    table:         "tasks"
    table2:        "task_categories"
    holiday_date:  "2026-12-25"
    # ---- 2026-09-18 轮新增（工作空间 / 需求矩阵 / 历史资产 / 归档工具）----
    prd_id:        "prd-001"        # prd_docs 夹具（seed-v3 生成 6 份）
    prd_doc_del:   "prd-006"
    prd_req_id:    "prq-001"        # prd_requirements 夹具（400 行）
    prd_req_del:   "prq-400"
    prd_issue_id:  "pri-001"        # prd_issues 夹具（写负载 PATCH 用，探针不得删改）
    prd_issue_del: "pri-080"        # 探针专用：先 resolve/writeback 再删除
    prd_issue_probe: "pri-079"      # 探针专用：resolve + writeback（保留行，不删）
    image_del:     "img-0010"       # 探针专用删除图片（img-0001 是读负载夹具，探针不得删）
    hist_proj:     "proj-hist-001"  # 历史快照项目（history_at 非空）
    proj_transfer: "proj-tri"       # 历史资产沉淀→恢复→归档删除 探针专用（不参与其它场景）
    tool_arch:     "tool-perf2"     # 已归档 AI 工具
    ws_file:       "src/mod1/handler_0.ts"   # 工作空间内真实存在的相对路径
    ws_q:          "perf"           # 全文检索词（文件树内含 perf-keyword-*，保证有命中）
    ws_sym_q:      "fn"             # 符号查询词（索引内 fn0..fn6）
  thread_profiles:
    smoke: { threads: 1,  ramp: 1, duration: 30 }
  list:
    # =================== 读端点（本地纯查询，无外部副作用）===================
    - name: "reads"
      profile: "smoke"
      samplers:
        - { name: "health",             path: "/api/health", method: "GET" }
        - { name: "logs",               path: "/api/logs", method: "GET", params: { since: "0" } }
        - { name: "projects",           path: "/api/projects", method: "GET" }
        - { name: "tasks_page",         path: "/api/tasks", method: "GET", params: { limit: "200" } }
        - { name: "tasks_archived",     path: "/api/tasks", method: "GET", params: { archived: "1" } }
        - { name: "tasks_by_project",   path: "/api/tasks", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "tasks_keyword",      path: "/api/tasks", method: "GET", params: { keyword: "{{keyword_q}}", limit: "100" } }
        - { name: "tasks_by_category",  path: "/api/tasks", method: "GET", params: { categoryId: "{{category_id}}", limit: "100" } }
        - { name: "tasks_sort_manual",  path: "/api/tasks", method: "GET", params: { sort: "manual", limit: "100" } }
        - { name: "tasks_by_no",        path: "/api/tasks/by-no/{{task_no}}", method: "GET" }
        - { name: "task_categories",    path: "/api/task-categories", method: "GET" }
        - { name: "task_images",        path: "/api/tasks/{{task_id}}/images", method: "GET" }
        - { name: "image_by_id",        path: "/api/images/{{image_id}}", method: "GET" }
        - { name: "aitools",            path: "/api/aitools", method: "GET" }
        - { name: "aitools_types",      path: "/api/aitools/types", method: "GET" }
        - { name: "aitools_defaults",   path: "/api/aitools/defaults", method: "GET" }
        - { name: "aitools_apikey",     path: "/api/aitools/{{tool_id}}/api-key", method: "GET" }
        - { name: "queues",             path: "/api/queues", method: "GET" }
        - { name: "queue_detail",       path: "/api/queues/{{queue_id}}", method: "GET" }
        - { name: "report_templates",   path: "/api/report/templates", method: "GET" }
        - { name: "console_jobs",       path: "/api/console-jobs", method: "GET" }
        - { name: "ai_usage",           path: "/api/ai/usage", method: "GET", params: { days: "7" } }
        - { name: "prompt_categories",  path: "/api/prompt-categories", method: "GET" }
        - { name: "prompts",            path: "/api/prompts", method: "GET" }
        - { name: "prompts_by_cat",     path: "/api/prompts", method: "GET", params: { categoryId: "{{prompt_cat_id}}" } }
        - { name: "req_categories",     path: "/api/req-categories", method: "GET" }
        - { name: "req_entries",        path: "/api/req-entries", method: "GET" }
        - { name: "req_entries_by_cat", path: "/api/req-entries", method: "GET", params: { categoryId: "{{req_cat_id}}" } }
        - { name: "plans",              path: "/api/plans", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "plans_archived",     path: "/api/plans/archived", method: "GET" }
        - { name: "plans_holidays",     path: "/api/plans/holidays", method: "GET" }
        - { name: "settings_note_proj", path: "/api/settings/note-project", method: "GET" }
        - { name: "update_version",     path: "/api/update/version", method: "GET" }
        - { name: "update_config",      path: "/api/update/config", method: "GET" }
        - { name: "tunnel_status",      path: "/api/tunnel/status", method: "GET" }
        - { name: "tunnel_config",      path: "/api/tunnel/config", method: "GET" }
        - { name: "tunnel_cf_status",   path: "/api/tunnel/cloudflare/login/status", method: "GET" }
        - { name: "db_tables",          path: "/api/dbadmin/tables", method: "GET" }
        - { name: "db_schema",          path: "/api/dbadmin/tables/{{table}}/schema", method: "GET" }
        - { name: "db_rows",            path: "/api/dbadmin/tables/{{table}}/rows", method: "GET", params: { limit: "50" } }
        # ---- 2026-09-18 新增端点（09-13 之后合入）----
        - { name: "history_summary",    path: "/api/history/summary", method: "GET" }
        - { name: "history_list",       path: "/api/history/list", method: "GET" }
        - { name: "ws_history",         path: "/api/projects/workspace-history", method: "GET" }
        - { name: "ai_summary_inbox",   path: "/api/settings/ai-summary-inbox", method: "GET" }
        - { name: "aitools_archived",   path: "/api/aitools/archived", method: "GET" }
        - { name: "prd_docs_list",      path: "/api/plans/prd-docs", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "prd_doc_one",        path: "/api/plans/prd-docs/{{prd_id}}", method: "GET" }
        - { name: "prd_issues_list",    path: "/api/plans/prd-issues", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "prd_reqs_list",      path: "/api/plans/prd-requirements", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "ws_symbols",         path: "/api/workspace/symbols", method: "GET", params: { projectId: "{{project_id}}", q: "{{ws_sym_q}}" } }

    # =================== 写端点（本地 DB 写；独立沙箱库，压完丢弃）====================
    # 口径说明：仅保留**可重复调用恒为 2xx** 的写端点进负载阶段。
    # POST /projects 自 09-13 起强制项目名全局唯一（含历史快照名），固定名重复调用必 400，
    # 属「夹具耗尽」而非服务缺陷 → 移入单发探针（probe: project_create_once）。
    - name: "writes"
      profile: "smoke"
      samplers:
        - { name: "patch_project",        path: "/api/projects/{{project_id}}", method: "PATCH",
            body: '{"description":"perf write load updated"}' }
        - { name: "create_task",          path: "/api/tasks", method: "POST",
            body: '{"projectId":"{{project_id}}","title":"perf-task","description":"perf write load","priority":"high","status":"todo"}' }
        - { name: "patch_task",           path: "/api/tasks/{{task_id}}", method: "PATCH",
            body: '{"priority":"normal","verified":true}' }
        - { name: "move_tasks",           path: "/api/tasks/move", method: "POST",
            body: '{"taskIds":["{{task_id3}}"],"projectId":"{{project_id2}}"}' }
        - { name: "reorder_tasks",        path: "/api/tasks/reorder", method: "POST",
            body: '{"orderedIds":["{{task_id}}","{{task_id2}}","{{task_id3}}"]}' }
        - { name: "batch_tasks",          path: "/api/tasks/batch", method: "POST",
            body: '{"ids":["{{task_id2}}"],"action":"status","value":"done"}' }
        - { name: "adopt_task",           path: "/api/tasks/{{task_id2}}/adopt", method: "POST",
            body: '{"content":"perf-adopted-content"}' }
        - { name: "task_to_prompt",       path: "/api/tasks/{{task_id2}}/to-prompt", method: "POST",
