            body: '{"status":"open"}' }
        - { name: "create_prd_issue",     path: "/api/plans/prd-issues", method: "POST",
            body: '{"projectId":"{{project_id}}","question":"perf 负载问题"}' }
        - { name: "patch_prd_req",        path: "/api/plans/prd-requirements/{{prd_req_id}}", method: "PATCH",
            body: '{"status":"todo"}' }
        - { name: "create_prd_req",       path: "/api/plans/prd-requirements", method: "POST",
            body: '{"projectId":"{{project_id}}","title":"perf 负载需求项","content":"perf req body"}' }

    # =================== 重端点（CPU 密集 / 大数据量）单线程 ===================
    - name: "heavy"
      profile: "smoke"
      samplers:
        - { name: "report_generate_xlsx", path: "/api/report/generate", method: "POST",
            body: '{"period":"week","format":"xlsx","projectId":"{{project_id}}"}' }
        - { name: "report_generate_pdf",  path: "/api/report/generate", method: "POST",
            body: '{"period":"week","format":"pdf","projectId":"{{project_id}}"}' }
        - { name: "plans_export",         path: "/api/plans/export", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "plans_template",       path: "/api/plans/template", method: "GET" }
        - { name: "settings_export",      path: "/api/settings/export", method: "GET" }
        - { name: "db_export",            path: "/api/dbadmin/tables/{{table}}/export", method: "GET" }
        - { name: "tasks_large_project",  path: "/api/tasks", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "queue_detail_grown",   path: "/api/queues/{{queue_id}}", method: "GET" }
        - { name: "ai_usage_90d",         path: "/api/ai/usage", method: "GET", params: { days: "90" } }
        # ---- 工作空间（同步 FS 遍历，事件循环阻塞评估重点）----
        - { name: "ws_search_fulltext",   path: "/api/workspace/search", method: "GET",
            params: { projectId: "{{project_id}}", q: "{{ws_q}}" } }
        - { name: "ws_search_nohit",      path: "/api/workspace/search", method: "GET",
            params: { projectId: "{{project_id}}", q: "zzznomatch" } }
        - { name: "ws_read_file",         path: "/api/workspace/file", method: "GET",
            params: { projectId: "{{project_id}}", path: "{{ws_file}}" } }
        - { name: "history_list_full",    path: "/api/history/list", method: "GET" }

    # =================== 稳定性混合（读为主 + 少量写，控制数据膨胀）===================
    - name: "mixed"
      profile: "smoke"
      samplers:
        - { name: "health",            path: "/api/health", method: "GET" }
        - { name: "tasks_page",        path: "/api/tasks", method: "GET", params: { limit: "200" } }
        - { name: "tasks_archived",    path: "/api/tasks", method: "GET", params: { archived: "1" } }
        - { name: "projects",          path: "/api/projects", method: "GET" }
        - { name: "queue_detail",      path: "/api/queues/{{queue_id}}", method: "GET" }
        - { name: "aitools",           path: "/api/aitools", method: "GET" }
        - { name: "plans",             path: "/api/plans", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "prompts",           path: "/api/prompts", method: "GET" }
        - { name: "console_jobs",      path: "/api/console-jobs", method: "GET" }
        - { name: "db_rows",           path: "/api/dbadmin/tables/{{table}}/rows", method: "GET", params: { limit: "50" } }
        - { name: "prd_reqs_list",     path: "/api/plans/prd-requirements", method: "GET", params: { projectId: "{{project_id}}" } }
        - { name: "create_task",       path: "/api/tasks", method: "POST",
            body: '{"projectId":"{{project_id}}","title":"stability-task","priority":"normal","status":"todo"}' }
        - { name: "patch_task",        path: "/api/tasks/{{task_id}}", method: "PATCH",
            body: '{"priority":"high"}' }

# ---------------------------------------------------------------------------
# 单发探针（破坏性/一次性端点）：不走负载阶段，由 perf/probe_endpoints.py 逐端点单发
# 目的：测量删除类、需全量前置数据类、外部依赖类的真实响应与延迟，
#       避免固定夹具在负载循环中反复触发 404/409 而污染错误率口径。
# ---------------------------------------------------------------------------
probes:
  timeout_sec: 120
  list:
    - { name: "task_category_delete", path: "/api/task-categories/{{category_del}}", method: "DELETE" }
    - { name: "prompt_category_delete", path: "/api/prompt-categories/{{prompt_cat_del}}", method: "DELETE" }
    - { name: "prompt_delete", path: "/api/prompts/{{prompt_del}}", method: "DELETE" }
    - { name: "req_category_delete", path: "/api/req-categories/{{req_cat_del}}", method: "DELETE" }
    - { name: "req_entry_delete", path: "/api/req-entries/{{req_del}}", method: "DELETE" }
    - { name: "aitool_delete", path: "/api/aitools/{{tool_del}}", method: "DELETE" }
    - { name: "project_delete", path: "/api/projects/{{project_del}}", method: "DELETE" }
    - { name: "plan_delete", path: "/api/plans/{{plan_del}}", method: "DELETE" }
    - { name: "plan_archive", path: "/api/plans/{{plan_id2}}/archive", method: "POST", body: '{}' }
    - { name: "plan_restore", path: "/api/plans/{{plan_id2}}/restore", method: "POST", body: '{}' }
    - { name: "plan_create_todo", path: "/api/plans/{{plan_id}}/create-todo", method: "POST", body: '{}' }
    - { name: "holiday_add", path: "/api/plans/holidays", method: "POST", body: '{"date":"{{holiday_date}}","name":"probe-holiday"}' }
    - { name: "holiday_delete", path: "/api/plans/holidays/{{holiday_date}}", method: "DELETE" }
    - { name: "queue_job_delete", path: "/api/queues/{{queue_id}}/jobs/job-perf-050", method: "DELETE" }
    - { name: "console_job_delete", path: "/api/console-jobs/{{console_job_id}}", method: "DELETE" }
    - { name: "archive_delete", path: "/api/archive", method: "DELETE", body: '{"taskIds":["task-a050"]}' }
    - { name: "image_delete", path: "/api/images/{{image_del}}", method: "DELETE" }
    - { name: "task_reuse", path: "/api/tasks/{{task_id2}}/reuse", method: "POST", body: '{"projectId":"{{project_id3}}"}' }
    - { name: "csv_import_preview", path: "/api/tasks/import-csv/preview", method: "POST", query: "?projectId={{project_id}}",
        body: '标题,描述,优先级\nprobe-csv-1,来自压测,high\nprobe-csv-2,来自压测,normal\n', content_type: "text/csv" }
    - { name: "csv_import_confirm", path: "/api/tasks/import-csv/confirm", method: "POST",
        body: '{"projectId":"{{project_id}}","items":[{"title":"probe-csv-1","priority":"high"},{"title":"probe-csv-2"}]}' }
    - { name: "plans_reorder", path: "/api/plans/reorder", method: "POST", dynamic: "plans_reorder" }
    - { name: "plans_from_req", path: "/api/plans/from-req", method: "POST",
        body: '{"reqEntryId":"{{req_id}}","projectId":"{{project_id}}"}' }
    - { name: "db_insert_row", path: "/api/dbadmin/tables/{{table2}}/rows", method: "POST", dynamic: "db_insert_row" }
    - { name: "db_patch_row", path: "/api/dbadmin/tables/{{table2}}/rows/{{category_extra}}", method: "PATCH",
        body: '{"name":"probe-patched-category"}' }
    - { name: "db_delete_row", path: "/api/dbadmin/tables/{{table2}}/rows/cat-del-002", method: "DELETE" }
    - { name: "db_batch_delete", path: "/api/dbadmin/tables/{{table2}}/batch-delete", method: "POST",
        body: '{"pks":["cat-del-003","cat-del-004"]}' }
    - { name: "console_jobs_clear", path: "/api/console-jobs", method: "DELETE" }
    - { name: "settings_import", path: "/api/settings/import", method: "POST", dynamic: "settings_import" }
    # ---- 2026-09-18 新增探针 ----
    - { name: "project_create_once", path: "/api/projects", method: "POST",
        body: '{"name":"perf-probe-project","description":"probe once"}' }
    - { name: "prd_doc_create", path: "/api/plans/prd-docs", method: "POST",
        body: '{"projectId":"{{project_id}}","filename":"probe-prd.md","contentMd":"# probe prd\\n探针文档"}' }
    - { name: "prd_doc_delete", path: "/api/plans/prd-docs/{{prd_doc_del}}", method: "DELETE" }
    - { name: "prd_issue_resolve", path: "/api/plans/prd-issues/{{prd_issue_probe}}", method: "PATCH",
        body: '{"status":"resolved","answer":"probe 结论"}' }
    - { name: "prd_issue_writeback", path: "/api/plans/prd-issues/{{prd_issue_probe}}/writeback", method: "POST", body: '{}' }
    - { name: "prd_issues_batch", path: "/api/plans/prd-issues/batch", method: "POST",
